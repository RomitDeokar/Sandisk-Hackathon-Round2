[metadata]
name = sandisk-wafer
version = 0.1.0
description = Sandisk Die Yield Prediction – Hackathon Submission

[options]
packages = find:
package_dir = =src
python_requires = >=3.9
install_requires =
    numpy>=1.23.0
    pandas>=1.5.0
    scipy>=1.9.0
    PyYAML>=6.0
    pyarrow>=10.0.0
    scikit-learn>=1.1.0
    matplotlib>=3
    joblib>=1.2.0
    lightgbm>=4.0.0
    torch>=2.0.0
    streamlit>=1.30.0

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
addopts = -v --tb=short
