# GPU optimized configuration

_base_: "configs/base.yaml"

device: "cuda"
num_workers: 4

model_a:
  type: "lightgbm"
  params:
    n_estimators: 100
    learning_rate: 0.04
    max_depth: 7
    num_leaves: 40
    subsample: 0.85
    colsample_bytree: 0.85
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

model_b:
  batch_size: 128
  epochs: 25
  learning_rate: 1.0e-3
  embedding_dim: 8
  hidden_dim: 32
  dropout: 0.4
  early_stopping_patience: 5
