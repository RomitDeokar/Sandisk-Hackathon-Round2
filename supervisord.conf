[supervisord]
nodaemon=false
logfile=/home/user/webapp/logs/supervisord.log
pidfile=/home/user/webapp/logs/supervisord.pid
childlogdir=/home/user/webapp/logs

[unix_http_server]
file=/home/user/webapp/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:streamlit]
command=python3 -m streamlit run dashboard/app.py
directory=/home/user/webapp
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/user/webapp/logs/streamlit.log
stderr_logfile=/home/user/webapp/logs/streamlit_error.log

[program:cloudflared]
command=/tmp/cloudflared tunnel --url http://localhost:8501 --no-autoupdate
directory=/home/user/webapp
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/user/webapp/logs/cloudflared.log
stderr_logfile=/home/user/webapp/logs/cloudflared.log
