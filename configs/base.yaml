# WaferFusion-Cascade Base Configuration

# Global experiment & reproducibility settings
seed: 42
experiment_name: "waferfusion_cascade_v1"

# Environment & hardware
device: "auto"  # 'auto', 'cuda', or 'cpu'
num_workers: 4

# Paths
paths:
  raw_train: "input/train.csv"
  raw_test: "input/test.csv"
  raw_validation: "input/validation.csv"
  processed_dir: "data/processed"
  features_dir: "data/features"
  artifacts_dir: "data/artifacts"
  models_dir: "outputs/models"
  metrics_dir: "outputs/metrics"
  predictions_dir: "outputs/predictions"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"

# Data schema and parameters
data:
  id_cols: ["wafer_id", "die_row", "die_col"]
  old_label_col: "old_label"
  target_col: "label"
  block_col: "block_readings"
  num_block_readings: 2000
  feature_prefix: "feature_"

# Validation & Grouped Splitting
cv:
  n_splits: 5
  group_col: "wafer_id"
  calibration_size: 0.2  # Wafer-grouped holdout for post-train calibration / conformal

# Feature engineering
features:
  top_k_parametric: 30
  spatial_windows: [3, 5, 7]
  epsilon: 1.0e-6
  scale_features: false  # Tree models don't require scaling

# Model A (Fast screening)
model_a:
  type: "lightgbm"  # lightgbm, xgboost, hist_gbm
  params:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

# Calibration
calibration:
  method: "isotonic"  # 'isotonic' or 'sigmoid'

# Conformal & Uncertainty Gate
conformal:
  coverage_levels: [0.90, 0.95, 0.975, 0.99]
  default_coverage: 0.95

# Cascade Routing Policy
routing:
  uncertainty_quantile: 0.85
  prob_margin: 0.20  # |p_A - threshold| < prob_margin -> route to Model B
  spatial_anomaly_threshold: 0.75
  disagreement_threshold: 0.30
  min_model_b_prob: 0.10
  max_model_b_prob: 0.90
  force_model_b_on_edge: false

# Model B (Deep sub-die block inspection & multi-resolution fusion)
model_b:
  block_length: 2000
  batch_size: 128
  epochs: 15
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  embedding_dim: 8
  hidden_dim: 32
  dropout: 0.4
  use_attention: true
  early_stopping_patience: 4

# Threshold optimization
threshold:
  min: 0.05
  max: 0.95
  step: 0.01
  metric: "fail_f1"  # 'fail_f1', 'fail_recall', 'pr_auc', 'balanced_accuracy'

# Policy for decision categorisation
policy:
  low_risk_threshold: 0.20
  high_risk_threshold: 0.60
