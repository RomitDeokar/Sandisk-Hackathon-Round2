# CPU optimized configuration
# Inherits structure from base.yaml with faster settings for CPU development / testing

_base_: "configs/base.yaml"

device: "cpu"
num_workers: 2

model_a:
  type: "lightgbm"
  params:
    n_estimators: 100
    learning_rate: 0.08
    max_depth: 5
    num_leaves: 20
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: "balanced"
    random_state: 42
    n_jobs: 2

model_b:
  batch_size: 32
  epochs: 8
  learning_rate: 1.0e-3
  embedding_dim: 8
  hidden_dim: 32
  dropout: 0.4
  early_stopping_patience: 3
